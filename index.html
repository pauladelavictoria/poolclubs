<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f9" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090b0e" />
  <meta name="description"
    content="PoolClubs keeps your pool club on the record: Elo rankings, match results, challenges and training plans." />
  <meta property="og:title" content="PoolClubs" />
  <meta property="og:description"
    content="Elo rankings, match results, challenges and training plans for pool clubs." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/android-chrome-512x512.png" />
  <title>PoolClubs</title>
  <link href="/src/index.css" rel="stylesheet" />
</head>

<body>
  <script>
    // Before the first paint, or the page flashes the wrong theme on its way
    // to the right one. A stored choice wins; otherwise follow the system.
    // Always writes an explicit value, which is what lets the stylesheet get
    // away with a single [data-theme="light"] rule.
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") ||
      (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
