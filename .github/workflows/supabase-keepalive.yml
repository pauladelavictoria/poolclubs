name: supabase-keepalive

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mon + Thu 06:00 UTC -> max 4-day gap
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Read one row from players
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/players?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/body
            exit 1
          fi

      - name: Keep cron alive if repo quiet
        run: |
          set -euo pipefail
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit ${age_days}d ago"
          if [ "$age_days" -lt 50 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push
